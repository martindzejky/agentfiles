# default settings for linking
- defaults:
    link:
      create: true
      force: true
      relink: true

# start by cleaning existing configurations
- clean:
    - '~/.cursor'

# update git submodules and generate per-agent files
- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - [python3 scripts/generate-dist.py, Generating Cursor rule dist]

# link configuration files
- link:
    # cursor
    ~/.cursor/skills: skills
    ~/.cursor/rules: dist/cursor/rules
    ~/.cursor/hooks.json: hooks.json
    ~/.cursor/hooks: hooks
