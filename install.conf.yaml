# default settings for linking
- defaults:
    link:
      create: true
      force: true
      relink: true

# start by cleaning existing configurations
- clean:
    - '~/.cursor'

# update git submodules and generate per-agent files
- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - [node scripts/generate-dist.mjs, Generating Cursor and Codex dist]

# link configuration files
- link:
    # cursor
    ~/.cursor/skills: skills
    ~/.cursor/rules: dist/cursor/rules
    ~/.cursor/hooks.json: hooks/agentmemory/cursor/hooks.json
    ~/.cursor/hooks: hooks
    # codex
    ~/.agents/skills: skills
    ~/.codex/AGENTS.md: dist/codex/AGENTS.md
    ~/.codex/hooks.json: hooks/agentmemory/codex/hooks.json
    ~/.codex/hooks: hooks
